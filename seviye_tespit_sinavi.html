<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seviye Tespit Sınavı</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--color-bg);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .quiz-container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: var(--shadow-md);
            max-width: 640px;
            width: 100%;
            margin-top: 24px;
        }
        h1 { color: var(--color-text); margin: 0 0 6px; text-align: center; }
        .subtitle { color: var(--color-muted); margin: 0 0 24px; font-size: 0.92rem; text-align: center; }

        /* --- Başlangıç Ekranı --- */
        #start-screen { text-align: center; }
        #start-screen .exam-desc { color: #555; font-size: 0.95rem; line-height: 1.5; margin: 0 0 24px; }
        #start-screen .meta-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .meta-pill {
            background: var(--color-bg);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--color-text);
        }
        #no-data-note {
            display: none;
            color: var(--color-danger);
            font-size: 0.88rem;
            margin-top: 10px;
        }

        /* --- Quiz Ekranı --- */
        #quiz-screen { display: none; }
        .level-badge-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .cur-level-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            background: #e3f2fd;
            color: #1565c0;
        }
        .progress { color: var(--color-primary); font-weight: 700; font-size: 0.95rem; }
        .section-title-line { font-size: 0.85rem; color: var(--color-muted); margin-bottom: 14px; }
        .question {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: var(--color-text);
            padding: 18px;
            background: var(--color-bg);
            border-radius: 8px;
            border-left: 6px solid var(--color-primary);
            text-align: left;
        }
        .options { display: grid; gap: 10px; grid-template-columns: 1fr; }
        .next-btn {
            margin-top: 22px;
            padding: 12px 30px;
            display: none;
        }

        /* --- Sonuç Ekranı --- */
        #result-screen { display: none; animation: fadeIn 0.5s; text-align: center; }
        .level-result-banner {
            background: linear-gradient(135deg, var(--it-green), #00693a);
            color: #fff;
            border-radius: 14px;
            padding: 26px 20px;
            margin: 20px 0 26px;
        }
        .level-result-banner .big-level {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .level-result-banner .caption {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 4px;
        }
        .breakdown {
            text-align: left;
            margin-bottom: 10px;
        }
        .breakdown-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            background: var(--color-bg);
            margin-bottom: 8px;
        }
        .breakdown-row .lvl {
            font-weight: 800;
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 14px;
            flex-shrink: 0;
        }
        .breakdown-row.passed .lvl { background: var(--color-success-lt); color: #1b5e20; }
        .breakdown-row.failed .lvl { background: var(--color-danger-lt); color: #7a1d1d; }
        .breakdown-row .b-title { flex: 1; font-size: 0.9rem; }
        .breakdown-row .b-score { font-weight: 700; font-size: 0.88rem; white-space: nowrap; }
        .breakdown-row .b-status { font-size: 1.1rem; }
        .restart-btn { margin-top: 8px; }
    </style>
</head>
<body>

    <div class="quiz-container">

        <div id="start-screen">
            <h1 id="start-title">Seviye Tespit Sınavı</h1>
            <div class="flag-inline" aria-hidden="true" style="height:5px;width:120px;border-radius:4px;background:linear-gradient(90deg, var(--it-green) 33.33%, #fff 33.33%, #fff 66.66%, var(--it-red) 66.66%);margin:0 auto 20px;border:1px solid #ddd;"></div>
            <p class="exam-desc" id="start-desc">Yükleniyor...</p>
            <div class="meta-row" id="meta-row"></div>
            <button class="btn btn-success" id="start-btn" onclick="startExam()">▶ Sınava Başla</button>
            <p id="no-data-note">Bu sınav henüz hazır değil. Öğretmeninin <a href="test-editor.html">Test Yönetici</a> sayfasından soru eklemesi gerekiyor.</p>
        </div>

        <div id="quiz-screen">
            <div class="level-badge-row">
                <span class="cur-level-badge" id="cur-level-badge">A1</span>
                <span class="progress" id="progress">Soru 1 / 3</span>
            </div>
            <div class="section-title-line" id="section-title-line"></div>

            <div class="question" id="question-text">Yükleniyor...</div>
            <div class="options" id="options-container"></div>

            <button class="btn btn-primary next-btn" id="next-btn" onclick="nextQuestion()">Sonraki Soru →</button>
        </div>

        <div id="result-screen">
            <h1>Sınav Tamamlandı!</h1>
            <div class="level-result-banner">
                <div class="big-level" id="final-level-text">A1</div>
                <div class="caption" id="final-level-caption">Tahmini seviyen</div>
            </div>
            <div class="breakdown" id="breakdown-container"></div>
            <button class="btn btn-success restart-btn" onclick="restartExam()">↺ Sınavı Tekrar Başlat</button>
        </div>

    </div>

<script src="seviye_tespit_data.js"></script>
<script>
    let testData = null;
    let flatSections = [];
    let currentSectionIndex = 0;
    let currentQuestionIndex = 0;
    let sectionCorrectCount = 0;
    let currentShuffledOptions = [];
    let results = [];

    function initStartScreen() {
        testData = loadTestData();
        flatSections = (testData.sections || []).filter(s => s.questions && s.questions.length > 0);

        document.getElementById('start-title').textContent = testData.title || 'Seviye Tespit Sınavı';
        document.getElementById('start-desc').textContent = testData.description || '';

        const totalQuestions = flatSections.reduce((sum, s) => sum + s.questions.length, 0);
        document.getElementById('meta-row').innerHTML = `
            <span class="meta-pill">📚 ${flatSections.length} bölüm</span>
            <span class="meta-pill">❓ ${totalQuestions} soru</span>
        `;

        const startBtn = document.getElementById('start-btn');
        const noDataNote = document.getElementById('no-data-note');
        if (flatSections.length === 0) {
            startBtn.disabled = true;
            noDataNote.style.display = 'block';
        } else {
            startBtn.disabled = false;
            noDataNote.style.display = 'none';
        }
    }

    function showScreen(name) {
        document.getElementById('start-screen').style.display = (name === 'start') ? 'block' : 'none';
        document.getElementById('quiz-screen').style.display = (name === 'quiz') ? 'block' : 'none';
        document.getElementById('result-screen').style.display = (name === 'result') ? 'block' : 'none';
    }

    function startExam() {
        if (flatSections.length === 0) return;
        results = [];
        loadSection(0);
        showScreen('quiz');
    }

    function loadSection(idx) {
        currentSectionIndex = idx;
        currentQuestionIndex = 0;
        sectionCorrectCount = 0;
        loadQuestion();
    }

    function loadQuestion() {
        const section = flatSections[currentSectionIndex];
        const q = section.questions[currentQuestionIndex];

        document.getElementById('cur-level-badge').textContent = section.level;
        document.getElementById('progress').textContent =
            `Soru ${currentQuestionIndex + 1} / ${section.questions.length}`;
        document.getElementById('section-title-line').textContent = section.title;
        document.getElementById('question-text').textContent = q.text;

        currentShuffledOptions = q.options.map((text, i) => ({ text: text, isCorrect: i === q.correct }));
        currentShuffledOptions.sort(() => Math.random() - 0.5);

        const container = document.getElementById('options-container');
        container.innerHTML = '';
        currentShuffledOptions.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt.text;
            btn.onclick = () => checkAnswer(btn, opt.isCorrect);
            container.appendChild(btn);
        });

        document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(selectedBtn, isCorrect) {
        const allBtns = document.querySelectorAll('#options-container .option-btn');
        allBtns.forEach(b => b.disabled = true);

        if (isCorrect) {
            selectedBtn.classList.add('correct');
            sectionCorrectCount++;
        } else {
            selectedBtn.classList.add('wrong');
            currentShuffledOptions.forEach((opt, i) => {
                if (opt.isCorrect) allBtns[i].classList.add('correct');
            });
        }
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextQuestion() {
        const section = flatSections[currentSectionIndex];
        currentQuestionIndex++;

        if (currentQuestionIndex < section.questions.length) {
            loadQuestion();
            return;
        }

        // Bölüm bitti — sonucu kaydet
        const total = section.questions.length;
        const percent = total > 0 ? (sectionCorrectCount / total) * 100 : 0;
        const threshold = (typeof testData.passThreshold === 'number') ? testData.passThreshold : 60;
        const passed = percent >= threshold;

        results.push({
            level: section.level,
            title: section.title,
            correct: sectionCorrectCount,
            total: total,
            passed: passed
        });

        if (passed && currentSectionIndex + 1 < flatSections.length) {
            loadSection(currentSectionIndex + 1);
        } else {
            showResults();
        }
    }

    function showResults() {
        const lastPassed = [...results].reverse().find(r => r.passed);
        const finalLevel = lastPassed ? lastPassed.level : null;

        document.getElementById('final-level-text').textContent = finalLevel ? finalLevel : 'A1 altı';
        document.getElementById('final-level-caption').textContent = finalLevel
            ? 'Tahmini CEFR seviyen'
            : 'A1 seviyesinden çalışmaya başlaman öneriliyor';

        const container = document.getElementById('breakdown-container');
        container.innerHTML = results.map(r => `
            <div class="breakdown-row ${r.passed ? 'passed' : 'failed'}">
                <span class="lvl">${r.level}</span>
                <span class="b-title">${escapeHtml(r.title)}</span>
                <span class="b-score">${r.correct}/${r.total}</span>
                <span class="b-status">${r.passed ? '✅' : '❌'}</span>
            </div>
        `).join('');

        showScreen('result');
    }

    function restartExam() {
        initStartScreen();
        showScreen('start');
    }

    // Klavye navigasyonu (1-4 tuşları ile seçim, Enter ile ileri)
    document.addEventListener('keydown', function (e) {
        const num = parseInt(e.key);
        if (num >= 1 && num <= 4) {
            const btns = document.querySelectorAll('#options-container .option-btn');
            if (btns[num - 1] && !btns[num - 1].disabled) btns[num - 1].click();
        }
        if ((e.key === 'Enter' || e.key === ' ') && document.getElementById('next-btn').style.display !== 'none') {
            e.preventDefault();
            document.getElementById('next-btn').click();
        }
    });

    initStartScreen();
</script>
<script src="shared.js"></script>
</body>
</html>
