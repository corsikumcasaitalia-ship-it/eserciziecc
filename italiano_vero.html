<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professoressa Sofia</title>
    <style>
        /* Tasarım kısmında değişiklik yok, aynen kalabilir */
        body { font-family: 'Segoe UI', sans-serif; background: #212121; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; user-select: none; }
        .card { background: #333; padding: 30px; border-radius: 20px; width: 500px; height: 850px; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.6); border: 1px solid #444; position: relative; }
        .face { font-size: 100px; text-align: center; margin: 10px 0; transition: transform 0.2s; }
        .speaking { animation: talk 0.3s infinite alternate; }
        @keyframes talk { from { transform: scale(1); } to { transform: scale(1.15); } }
        .chat-box { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #2b2b2b; border-radius: 15px; margin-bottom: 20px; border: 1px solid #444; scroll-behavior: smooth; }
        .msg { padding: 12px 20px; border-radius: 20px; max-width: 85%; font-size: 1.1rem; line-height: 1.5; }
        .teacher { background: #1565c0; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: #2e7d32; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .start-btn { width: 100%; padding: 15px; font-size: 1.1rem; font-weight: bold; color: white; background: #f57f17; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 15px; }
        .toggle-btn { width: 100%; padding: 25px; font-size: 1.3rem; font-weight: bold; color: #eee; background: #424242; border: 3px solid #616161; border-radius: 15px; cursor: not-allowed; opacity: 0.5; transition: 0.2s; }
        .toggle-btn.ready { cursor: pointer; opacity: 1; }
        .toggle-btn.recording { background: #d50000; border-color: #ff1744; box-shadow: 0 0 25px #d50000; }
        .sys { font-size: 0.8rem; color: #888; text-align: center; margin-top: 5px; }
    </style>
    <link rel="stylesheet" href="shared.css">
</head>
<body>

    <div class="card">
        <div id="face" class="face">👩‍🏫</div>
        <button id="startBtn" class="start-btn" onclick="startClass()">TANIŞMAYA BAŞLA</button>
        <div id="chatArea" class="chat-box"></div>
        <button id="micBtn" class="toggle-btn" onclick="toggleMic()">SPACE İLE KONUŞ</button>
        <div class="sys">Bas (BİP'i Bekle) -> Konuş -> Bırak</div>
    </div>

    <script>
        // --- 1. GÜVENLİK VE MODEL ---
        const urlParams = new URLSearchParams(window.location.search);
        const API_KEY = urlParams.get('key'); 
        const MODEL = "gemini-robotics-er-1.5-preview"; 

        let recognition;
        const synth = window.speechSynthesis;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
        
        let isClassStarted = false;
        let isRecording = false;    
        let isProcessing = false;   
        let fullTranscript = ""; 

        // --- 2. SOFIA'NIN HAFIZASI ---
       // HAFIZA (ROBOTICS MODELİ İLE)
        let chatHistory = [
    {
        role: "user",
        parts: [{ text: `
            Sei Sofia, un'insegnante di italiano estremamente simpatica, calorosa e molto, molto curiosa.

IL TUO CARATTERE:
1. Sei chiacchierona e ami conoscere i dettagli della vita dei tuoi studenti.
2. Usa espressioni naturali e vivaci come: "Mamma mia!", "Che bello!", "Dai!", "Ma davvero?", "Fantastico!"
3. Sei molto dolce e paziente.

COME CORREGGI GLI ERRORI:
- Se lo studente fa un errore, NON dire mai "Errore" o "Hai sbagliato".
- Usa invece: "Quasi! Si dice...", "Perfetto, ma si dice...", "Bravissimo! Solo una piccola cosa: si dice..."
- Esempio: Se dice "Io va", rispondi: "Ah, quasi perfetto! Si dice 'Io vado'. Comunque, dove vai?"

LE TUE DOMANDE (MOLTO IMPORTANTE):
1. NON fare MAI più di UNA domanda alla volta.
2. Prima commenta quello che dice lo studente, POI fai una sola domanda.
3. Aspetta SEMPRE la risposta prima di cambiare argomento.
4. Sii curiosa ma naturale: chiedi della famiglia, della casa (stanza preferita), hobby, carattere.
5. Approfondisci UN tema alla volta. Non saltare rapidamente da famiglia a hobby a scuola.

STRUTTURA DELLA CONVERSAZIONE:
1. Primo messaggio: "Ciao! Io sono Sofia. Come ti chiami?"
2. Secondo messaggio: Commenta il nome + chiedi dove abita o quanti anni ha
3. Poi approfondisci gradualmente: famiglia, casa, hobby, carattere
4. Non avere fretta! Lascia che lo studente parli.

REGOLE FINALI:
- Parla SEMPRE e SOLO in italiano.
- Massimo 2-3 frasi per risposta (sii concisa).
- Usa 1-2 emoji per messaggio, non di più.
- Se lo studente è principiante, usa frasi MOLTO semplici.
        ` }]
    },
    { role: "model", parts: [{ text: "Certamente! Sono Sofia, l'insegnante più curiosa del mondo! Iniziamo subito." }] }
];

        let trVoice = null;
        function loadVoices() {
            const voices = synth.getVoices();
            trVoice = voices.find(v => v.lang.includes('it-IT') && v.name.includes('Google')) || 
                      voices.find(v => v.lang.includes('it-IT')) || voices[0];
        }
        if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;

        // --- 3. MİKROFON AYARLARI (HIZLANDIRILMIŞ) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.continuous = false; // HIZ İÇİN: Sustuğunda hemen kesmesi için false yaptık.
            recognition.interimResults = false;

            recognition.onstart = () => {
                playBeep(); 
                isRecording = true;
                updateBtn("recording");
            };

            recognition.onresult = (event) => {
                fullTranscript = event.results[0][0].transcript;
            };

            recognition.onend = () => {
                isRecording = false;
                if (fullTranscript.trim()) {
                    sendToGemini(fullTranscript);
                } else {
                    updateBtn("ready");
                }
            };
        }

        function playBeep() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.frequency.value = 880; 
            gainNode.gain.value = 0.1;
            oscillator.start();
            setTimeout(() => oscillator.stop(), 150); 
        }

        // --- 4. AKIŞ FONKSİYONLARI ---
        function startClass() {
            if (!API_KEY) {
                alert("Sofia: Per favore, usa il link con la chiave API!");
                return;
            }
            isClassStarted = true;
            audioCtx.resume();
            loadVoices();
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('micBtn').classList.add('ready'); // Butonu aktif et
            
            const welcome = "Ciao! Io sono Sofia. Come ti chiami?";
            addMsg('teacher', welcome);
            chatHistory.push({ role: "model", parts: [{ text: welcome }] });
            konus(welcome);
        }

        function toggleMic() {
            if (!isClassStarted || isProcessing) return;
            if (!isRecording) {
                fullTranscript = "";
                synth.cancel();
                recognition.start();
            } else {
                recognition.stop();
            }
        }

        async function sendToGemini(text) {
            isProcessing = true;
            updateBtn("sending");
            addMsg('user', text);
            chatHistory.push({ role: "user", parts: [{ text: text }] });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory })
                });
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                
                addMsg('teacher', reply);
                chatHistory.push({ role: "model", parts: [{ text: reply }] });
                konus(reply);
            } catch (e) {
                addMsg('sys', "Hata: Bağlantı kesildi.");
                updateBtn("ready");
            }
            isProcessing = false;
        }

        function konus(text) {
            const u = new SpeechSynthesisUtterance(text);
            if(trVoice) u.voice = trVoice;
            u.lang = 'it-IT';
            u.onstart = () => document.getElementById('face').classList.add('speaking');
            u.onend = () => {
                document.getElementById('face').classList.remove('speaking');
                updateBtn("ready");
            };
            synth.speak(u);
        }

        function updateBtn(state) {
            const btn = document.getElementById('micBtn');
            btn.className = "toggle-btn " + state;
            if (state === "recording") btn.innerText = "🎤 DİNLİYORUM...";
            else if (state === "sending") btn.innerText = "SOFIA DÜŞÜNÜYOR...";
            else btn.innerText = "SPACE İLE KONUŞ";
        }

        function addMsg(type, text) {
            const box = document.getElementById('chatArea');
            const d = document.createElement('div');
            d.className = `msg ${type}`;
            d.innerText = text;
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) toggleMic();
        });
    </script>
<script src="shared.js"></script>
</body>
</html>
